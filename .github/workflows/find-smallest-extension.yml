name: Find Smallest Chrome Extension ID

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest

    steps:
      - name: Clone manifest dataset
        run: |
          git clone --depth 1 \
            https://github.com/ishandutta2007/chrome-extension-manifests-dataset.git \
            dataset

      - name: Inspect dataset
        working-directory: dataset
        run: |
          echo "===== ROOT ====="
          ls -la

          echo
          echo "===== DIRECTORIES ====="
          find . -maxdepth 2 -type d | head -50

      - name: Find smallest ID with key
        shell: python
        run: |
          import json
          import pathlib

          root = pathlib.Path("dataset")

          candidates = []

          for path in root.rglob("manifest.json"):
              try:
                  data = json.loads(
                      path.read_text(encoding="utf-8")
                  )
              except Exception:
                  continue

              key = data.get("key")

              if not isinstance(key, str) or not key:
                  continue

              # 从路径中寻找 Chrome Extension ID
              parts = path.parts

              for part in reversed(parts):
                  if (
                      len(part) == 32
                      and all("a" <= c <= "p" for c in part)
                  ):
                      extension_id = part
                      break
              else:
                  continue

              candidates.append({
                  "id": extension_id,
                  "name": data.get("name"),
                  "key": key,
                  "path": str(path),
              })

          # 按 Extension ID 的 ASCII 字典序排序
          candidates.sort(key=lambda x: x["id"])

          print("Total manifests with key:", len(candidates))
          print()

          if not candidates:
              raise SystemExit("No manifest with key found")

          # 去重后再排序
          unique = {}

          for item in candidates:
              if item["id"] not in unique:
                  unique[item["id"]] = item

          candidates = sorted(
              unique.values(),
              key=lambda x: x["id"]
          )

          print("Unique extension IDs with key:", len(candidates))
          print()

          best = candidates[0]

          print("=" * 80)
          print("SMALLEST EXTENSION ID")
          print("=" * 80)
          print("ID:       ", best["id"])
          print("NAME:     ", best["name"])
          print("KEY:      ", best["key"])
          print("MANIFEST: ", best["path"])
          print("=" * 80)

          with open("result.txt", "w", encoding="utf-8") as f:
              f.write("ID=" + best["id"] + "\n")
              f.write("NAME=" + str(best["name"]) + "\n")
              f.write("KEY=" + best["key"] + "\n")
              f.write("MANIFEST=" + best["path"] + "\n")

      - name: Show result
        run: |
          echo "===== RESULT ====="
          cat dataset/result.txt

      - name: Write summary
        run: |
          {
            echo "# Smallest Chrome Extension ID"
            echo
            echo '```text'
            cat dataset/result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: smallest-extension-id
          path: dataset/result.txt

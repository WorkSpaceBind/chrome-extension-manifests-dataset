name: Find Smallest Chrome Extension ID

on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest

    steps:
      - name: Clone manifest dataset
        run: |
          git clone --depth 1 \
            https://github.com/ishandutta2007/chrome-extension-manifests-dataset.git \
            dataset

      - name: Find smallest extension ID
        working-directory: dataset
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          ids = set()

          for snapshot in root.glob("manifests-*"):
              if not snapshot.is_dir():
                  continue

              for f in snapshot.iterdir():
                  if not f.is_file():
                      continue

                  id = f.stem

                  # Chrome extension ID: 32 chars, each a-p
                  if len(id) == 32 and all('a' <= c <= 'p' for c in id):
                      ids.add(id)

          print("Total unique extension IDs:", len(ids))

          if not ids:
              raise SystemExit("No extension IDs found")

          smallest = min(ids)

          print("Smallest extension ID:")
          print(smallest)

          Path("../result.txt").write_text(
              f"{smallest}\n",
              encoding="utf-8"
          )
          PY

      - name: Show result
        run: |
          echo "===== RESULT ====="
          cat result.txt

      - name: Write summary
        run: |
          {
            echo "# Smallest Chrome Extension ID"
            echo
            echo '```text'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: smallest-extension-id
          path: result.txt
